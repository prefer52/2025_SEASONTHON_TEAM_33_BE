spring:
  config:
    activate:
      on-profile: local

  cors:
    origin: ${CORS_ORIGIN:localhost}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/samsamejo_db?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  security:
    login:
      success-redirect-uri: http://localhost:8080
      not-registered-redirect-uri: http://localhost:8080/fail

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}